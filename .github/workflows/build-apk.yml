name: Build APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.13"
    - name: Disable Gradle configuration cache
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties
        echo "org.gradle.configuration-cache.problems=warn" >> ~/.gradle/gradle.properties
    - name: Cache Android Debug Keystore
      uses: actions/cache@v4
      with:
        path: ~/.android
        key: android-debug-keystore-v1
    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
    - name: Install system deps
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update -o Acquire::Timeout=10 -o Acquire::Retries=3
        sudo apt-get install -y pkg-config python3-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev binutils
    - name: Install NDK 28c manually
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        cd /home/runner/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p android-sdk/cmdline-tools/latest
        mv cmdline-tools/* android-sdk/cmdline-tools/latest/
        rm -rf cmdline-tools
        export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
        ln -sf $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
        $ANDROID_HOME/tools/bin/sdkmanager "ndk;28.0.12433566"
        ln -sf $ANDROID_HOME/ndk/28.0.12433566 /home/runner/.buildozer/android/platform/android-ndk-r28c
    - name: Install dev tools
      run: |
        uv venv --python 3.13
        uv pip install --python .venv/bin/python "ksp-bootstraps @ git+https://github.com/kivy-school/ksp-bootstraps@93952f708a5e1e28e7649bb008def41c99946d96" "ksproject==0.0.1.post0" pytest
    - name: Patch ksproject URLs
      run: |
        find .venv -name "*.py" -exec sed -i 's/pypi\.kivyschool\.com/pypi.anaconda.org\/kivyschool/g' {} +
    - name: Build APK
      env:
        UV_PYTHON: 3.13
      run: |
        set +e
        .venv/bin/ksproject android build debug --clean
        KS_EXIT=$?
        set -e
        echo "ksproject exit: $KS_EXIT"
        APK=$(find project_dist/gradle/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
        if [ -z "$APK" ]; then
          echo "FATAL: No APK produced"
          exit 1
        fi
        echo "APK produced at: $APK"
    - name: Verify libpython3.13 alias in APK
      run: |
        APK=$(find project_dist/gradle/app/build/outputs/apk/debug -name "*.apk" | head -1)
        echo "=== lib/arm64-v8a contents ==="
        unzip -l "$APK" | grep "lib/arm64-v8a/" || true
        echo ""
        if unzip -l "$APK" | grep -q "lib/arm64-v8a/libpython3.13.so"; then
          echo "OK: libpython3.13.so present"
        else
          echo "FATAL: libpython3.13.so MISSING from APK — the alias task didn't run or didn't merge. Refusing to upload broken APK."
          exit 1
        fi
    - name: Rename APK
      run: |
        APK=$(find project_dist/gradle/app/build/outputs/apk/debug -name "*.apk" | head -1)
        mv "$APK" project_dist/gradle/app/build/outputs/apk/debug/RACF.apk
    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: project_dist/gradle/app/build/outputs/apk/debug/RACF.apk
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
