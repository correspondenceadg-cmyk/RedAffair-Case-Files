name: Build APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.13"
    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
    - name: Install system deps
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update -o Acquire::Timeout=10 -o Acquire::Retries=3
        sudo apt-get install -y pkg-config python3-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libsdl2-dev
    - name: Install NDK 28c manually
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        cd /home/runner/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p android-sdk/cmdline-tools/latest
        mv cmdline-tools/* android-sdk/cmdline-tools/latest/
        rm -rf cmdline-tools
        export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
        ln -sf $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
        $ANDROID_HOME/tools/bin/sdkmanager "ndk;28.0.12433566"
        ln -sf $ANDROID_HOME/ndk/28.0.12433566 /home/runner/.buildozer/android/platform/android-ndk-r28c
    - name: Sync dependencies
      run: uv sync --dev
    - name: Build APK
      env:
        UV_PYTHON: 3.13
      run: uv run ksproject android build debug --clean
    - name: Rename APK
      run: |
        mv project_dist/gradle/app/build/outputs/apk/debug/*.apk project_dist/gradle/app/build/outputs/apk/debug/RACF.apk
    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: project_dist/gradle/app/build/outputs/apk/debug/RACF.apk
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
