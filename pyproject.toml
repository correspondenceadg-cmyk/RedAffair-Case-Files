[project]
name = "redaffair-case-files"
version = "0.1.6"
description = "A text-based adventure and detective game written in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer",
    "kivy>=2.3.1,<3.0.0",
]

[project.scripts]
redaffair-case-files = "redaffair:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["redaffair*"]

[tool.setuptools.package-data]
redaffair = [
    "assets/*.png",
    "audio/*.ogg",
    "audio/sfx/*.ogg",
    "fonts/*.otf",
    "fonts/*.ttf",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
ksp-bootstraps = { git = "https://github.com/kivy-school/ksp-bootstraps", branch = "master" }

[dependency-groups]
dev = [
    "ksp-bootstraps",
    "ksproject",
    "pytest",
]

[tool.uv]
index-strategy = "unsafe-best-match"
find-links = ["./wheelhouse"]

[tool.uv.pip]
extra-index-url = [
    "https://pypi-index.psychowaspx.workers.dev/simple",
    "https://pypi.anaconda.org/kivyschool/simple"
]
find-links = ["./wheelhouse"]

#### kivy-school configuration ####

[tool.kivy-school]
app_name = "Red Affair: Case Files"
bootstrap = "kivy"

[tool.kivy-school.android]
package_name = "ws.tilda.sentryprotocol.redaffaircasefiles"
version_name = "0.1.6"
version_code = 106
icon = "RAlogos.png"
presplash = "presplash.png"
presplash_color = "#e40909"

archs = ["arm64-v8a"]
gradle_dependencies = []
gradle_plugins = []
permissions = []

api = 36
min_api = 28
sdk = "36"
ndk = "28c"
ndk_api = 28

global_tools = true
byte_compile_python = true

[tool.kivy-school.ios]
bundle_id = "org.example.redaffaircasefiles"
minimum_deployment = "15.6"
info_plist = {}
entitlements = {}
permissions = []
frameworks = []

[tool.kivy-school.macos]
bundle_id = "org.example.redaffaircasefiles"
minimum_deployment = "11.5"
info_plist = {}
entitlements = {}
